<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aspire Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="tok-font" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#fff8f0; --ink-dim:rgba(255,248,240,.72); --line:rgba(255,255,255,.22);
    --bg:#1a1310; --pop:#ef8a35;
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
    --sans:var(--f-text,-apple-system),-apple-system,system-ui,"Segoe UI",sans-serif;
    --serif:var(--f-display,ui-serif),ui-serif,Georgia,serif;
    /* the stage is sized to the large viewport: mobile Safari's toolbar coming
       back must not resize it mid-scrub */
    --stage:100vh;
  }
  @supports (height:100lvh){:root{--stage:100lvh}}
  *{box-sizing:border-box}
  html{scroll-behavior:auto}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-text-size-adjust:100%}
  :focus-visible{outline:2px solid #ffd36a;outline-offset:3px;border-radius:6px}

  .stage{position:sticky;top:0;height:var(--stage);overflow:hidden;background:var(--bg)}
  .stage canvas{display:block;width:100%;height:100%;object-fit:cover}
  /* a scrim so type always has contrast, whatever the frame under it is doing */
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(rgba(20,13,9,.55) 0,rgba(20,13,9,.12) 34%,rgba(20,13,9,0) 52%)}
  .run{position:relative}

  /* ------------------------------------------------------------ landing */
  /* Every value here is a token. Shuffle rolls a new set from families that
     stay inside the XS palette; the seed lives in the URL, so a style you like
     is a link you can send. */
  .land{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;
    display:flex;flex-direction:column;gap:28px;
    padding:calc(22px + var(--safeT)) 20px calc(20px + var(--safeB));
    background:var(--l-bg);color:var(--l-ink);font-family:var(--sans);
    transition:background-color .5s,color .5s}
  .land::before{content:"";position:absolute;left:-30%;right:-30%;bottom:-38%;height:70%;
    background:radial-gradient(closest-side,var(--l-accent),transparent);opacity:var(--l-glow);
    pointer-events:none;transition:opacity .5s}
  .land > *{position:relative}
  .mark{margin:0;font-family:var(--serif);font-weight:var(--d-weight);text-transform:var(--d-case);
    letter-spacing:var(--d-track);line-height:.9;font-size:clamp(52px,calc(17vw * var(--d-scale)),150px)}
  .mark span{display:block}
  .mark small{display:block;font-size:.34em;letter-spacing:calc(var(--d-track) + .32em);
    margin-top:.5em;font-weight:inherit;color:var(--l-accent)}
  .lines{margin:auto 0 0;padding:0;list-style:none;font-family:var(--serif);
    font-weight:var(--d-weight);text-transform:var(--d-case);letter-spacing:var(--d-track);
    font-size:clamp(30px,calc(9.5vw * var(--d-scale)),76px);line-height:1.02}
  .lines li + li{margin-top:.12em}
  .lines em{font-family:var(--g-font,var(--serif));font-weight:var(--g-weight,inherit)}
  .g-accent .lines em{font-style:normal;color:var(--l-accent)}
  .g-italic .lines em{font-style:italic;color:var(--l-accent2)}
  .g-outline .lines em{font-style:normal;color:transparent;-webkit-text-stroke:.035em var(--l-accent)}
  .g-underline .lines em{font-style:normal;text-decoration:underline;text-decoration-color:var(--l-accent);
    text-decoration-thickness:.09em;text-underline-offset:.12em}
  .intro{margin:0;font-size:16.5px;line-height:1.5;color:var(--l-dim);max-width:30ch}
  .l-center{text-align:center;align-items:center}
  .l-center .intro{margin-inline:auto}
  .l-split .mark{margin-bottom:auto}
  .l-split .lines{margin-top:0}
  .tokbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--l-dim)}
  .l-center .tokbar{justify-content:center}
  .shuffle{min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid currentColor;
    background:transparent;color:var(--l-ink);font:600 14px/1 var(--sans);cursor:pointer}
  .shuffle:active{transform:scale(.97)}
  .look[aria-pressed="true"]{background:var(--l-ink);color:var(--l-bg);border-color:var(--l-ink)}
  .tokname{flex-basis:100%}
  .tokname{font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .down{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
    padding:0 18px;border-radius:var(--r);background:var(--l-accent);color:var(--l-bg);
    font:600 14px/1 var(--sans);text-decoration:none}
  @media (min-width:900px){
    .land{padding:calc(40px + var(--safeT)) 7vw 40px}
    .intro{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){ .land,.land::before{transition:none} }

  /* the opening line, over the first frames */
  .beat{position:absolute;top:calc(var(--safeT) + 9vh);left:20px;right:20px;z-index:3;
    pointer-events:none;transition:opacity .45s}
  .beat .beat-h{font-family:var(--serif);font-weight:400;font-size:clamp(34px,10vw,48px);
    line-height:1.03;letter-spacing:-.02em;margin:0 0 10px;max-width:11ch;
    text-shadow:0 2px 24px rgba(0,0,0,.35)}
  .beat p{margin:0;font-size:16px;line-height:1.45;color:var(--ink-dim);max-width:24ch;
    text-shadow:0 1px 18px rgba(0,0,0,.35)}
  .cap{position:absolute;left:0;right:0;bottom:calc(16px + var(--safeB));z-index:3;
    text-align:center;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-dim);transition:opacity .35s;pointer-events:none}

  /* the rooms, once the pour has filled the frame */
  .rooms{position:fixed;inset:auto 0 0;z-index:4;
    padding:26px 16px calc(22px + var(--safeB));
    color:var(--l-ink,var(--ink));
    background:linear-gradient(transparent 0,
      color-mix(in srgb,var(--l-bg,#1a1310) 66%,transparent) 34%,
      color-mix(in srgb,var(--l-bg,#1a1310) 94%,transparent) 100%);
    opacity:0;visibility:hidden;transform:translateY(14px);
    transition:opacity .45s,transform .45s,visibility .45s}
  .rooms.on{opacity:1;visibility:visible;transform:none}
  .rooms h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 12px}
  .rooms ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .room{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;
    padding:13px 15px;border:1px solid color-mix(in srgb,var(--l-ink,#fff) 22%,transparent);
    border-radius:var(--r,14px);
    background:color-mix(in srgb,var(--l-bg,#1a1310) 42%,transparent);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:inherit;font:inherit;text-align:left;cursor:pointer}
  .room b{font-weight:600;font-size:15.5px;flex:1}
  .room span{font-size:12px;color:var(--l-dim,var(--ink-dim));font-variant-numeric:tabular-nums}
  .room i{width:8px;height:8px;border-radius:50%;background:var(--l-accent,var(--pop));flex:none}

  /* one room */
  .sheet{position:fixed;inset:0;z-index:5;background:var(--l-bg,#120d0b);color:var(--l-ink,var(--ink));
    padding:calc(16px + var(--safeT)) 0 calc(18px + var(--safeB));
    display:flex;flex-direction:column;gap:14px;
    opacity:0;visibility:hidden;transform:scale(1.2);
    transition:opacity .4s ease-out,transform .5s cubic-bezier(.16,.84,.28,1),visibility .5s}
  .sheet.on{opacity:1;visibility:visible;transform:none}
  .sheet header{display:flex;align-items:flex-start;gap:12px;padding:0 20px}
  .sheet h2{font-family:var(--serif);font-weight:400;font-size:29px;margin:0;flex:1}
  .back{width:44px;height:44px;flex:none;border:1px solid currentColor;border-radius:50%;
    background:transparent;color:inherit;font-size:17px;cursor:pointer}
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:4px 20px 14px;-webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .mini{scroll-snap-align:start;flex:0 0 76%;min-height:172px;border-radius:var(--r,16px);
    border:1px solid color-mix(in srgb,var(--l-ink,#fff) 20%,transparent);
    background:color-mix(in srgb,var(--l-ink,#fff) 6%,transparent);padding:16px;
    display:flex;flex-direction:column;gap:6px}
  .mini b{font-size:15px}
  .mini p{margin:0;font-size:13.5px;line-height:1.45;color:var(--l-dim,var(--ink-dim))}
  .mini b{font-family:var(--serif);font-weight:var(--d-weight);font-size:19px}
  .mini ul{margin:auto 0 0;padding:0;list-style:none;display:flex;gap:6px;flex-wrap:wrap}
  .mini li{font-size:11.5px;border:1px solid color-mix(in srgb,var(--l-ink,#fff) 24%,transparent);border-radius:999px;padding:4px 9px}

  @media (min-width:900px){
    .beat{left:7vw;right:auto;top:calc(var(--safeT) + 20vh)}
    .rooms{max-width:440px;left:7vw;border-radius:18px 18px 0 0}
    .mini{flex-basis:320px}
  }

  /* nothing here is gated behind motion: no scrub, everything still reachable */
  @media (prefers-reduced-motion:reduce){
    .run{height:auto !important}
    .cap{display:none}
    .rooms{position:static;opacity:1;visibility:visible;transform:none;background:var(--bg)}
  }
</style>
</head>
<body>

<header class="land l-stack g-accent" id="land">
  <h1 class="mark"><span>Aspire</span><small>Health</small></h1>
  <ul class="lines" aria-label="Eat good, feel good, play good">
    <li>Eat <em>good.</em></li>
    <li>Feel <em>good.</em></li>
    <li>Play <em>good.</em></li>
  </ul>
  <p class="intro">Nutrition for the whole day, sorted into five rooms. Start with a can.</p>
  <div class="tokbar">
    <a class="down" href="#run">Pour it</a>
    <button class="shuffle look" type="button" data-look="A" aria-pressed="false">Look A</button>
    <button class="shuffle look" type="button" data-look="B" aria-pressed="false">Look B</button>
    <button class="shuffle" id="shuffle" type="button" aria-describedby="tokname">Shuffle</button>
    <span class="tokname" id="tokname" aria-live="polite"></span>
  </div>
</header>

<div class="run" id="run">
  <div class="stage" id="stage">
    <canvas id="film" role="img"
      aria-label="An XS Peach Mango can pours into a glass, seen from inside the glass looking up, until the frame fills with orange drink."></canvas>
    <div class="beat" id="beat">
      <h2 class="beat-h">One can,<br>five rooms</h2>
      <p>Scroll. The can does the rest.</p>
    </div>
    <p class="cap" id="cap">Scroll</p>
  </div>
</div>

<nav class="rooms" id="rooms" aria-label="Rooms">
  <h2>Where do you want to start?</h2>
  <ul id="room-list"></ul>
</nav>

<section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheet-title">
  <header><h2 id="sheet-title"></h2>
    <button class="back" id="back" aria-label="Back to the rooms">&times;</button></header>
  <div class="rail" id="rail"></div>
</section>

<script>
/* ------------------------------------------------------------ style tokens */
(function(){
  'use strict';
  // Families stay inside the XS world: charcoal, cream, ember, orange, peach,
  // with the can's green as the second accent. Randomness only picks within them.
  var PALETTES = [
    {name:'Charcoal', bg:'#15110e', ink:'#fbf4ea', dim:'rgba(251,244,234,.68)', accent:'#ef8a35', accent2:'#f6b36b', glow:.32},
    {name:'Ember',    bg:'#2a1509', ink:'#fff3e6', dim:'rgba(255,243,230,.7)',  accent:'#ff9a3d', accent2:'#7fc79a', glow:.4},
    {name:'Cream',    bg:'#f6ede0', ink:'#1b1410', dim:'rgba(27,20,16,.66)',    accent:'#e0671f', accent2:'#1f7a4c', glow:.22},
    {name:'Orange',   bg:'#ea7a2c', ink:'#1a100a', dim:'rgba(26,16,10,.72)',    accent:'#fff3e6', accent2:'#1f5f3c', glow:.3},
    {name:'Peach',    bg:'#f7c9a0', ink:'#2a160a', dim:'rgba(42,22,10,.7)',     accent:'#c9501a', accent2:'#1f7a4c', glow:.3},
    {name:'Forest',   bg:'#0f1a14', ink:'#f2efe6', dim:'rgba(242,239,230,.68)', accent:'#ef8a35', accent2:'#8fcf9f', glow:.28}
  ];
  var FONTS = [
    {name:'Archivo Black', d:'"Archivo Black"', t:'Inter', w:400, q:'family=Archivo+Black&family=Inter:wght@400;500;600'},
    {name:'Fraunces',      d:'Fraunces', t:'Inter', w:600, q:'family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600'},
    {name:'Bricolage',     d:'"Bricolage Grotesque"', t:'"DM Sans"', w:800, q:'family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:wght@400;500;600'},
    {name:'Syne',          d:'Syne', t:'"DM Sans"', w:800, q:'family=Syne:wght@600..800&family=DM+Sans:wght@400;500;600'},
    {name:'DM Serif',      d:'"DM Serif Display"', t:'"DM Sans"', w:400, q:'family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600'},
    {name:'Anton',         d:'Anton', t:'Inter', w:400, q:'family=Anton&family=Inter:wght@400;500;600'},
    {name:'Space Grotesk', d:'"Space Grotesk"', t:'"Space Grotesk"', w:700, q:'family=Space+Grotesk:wght@400;500;700'}
  ];
  var LAYOUTS = ['stack', 'center', 'split'];
  var GOODS = ['accent', 'italic', 'outline', 'underline'];

  function rng(seed){                               // mulberry32: a seed is a style
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function pick(r, a){ return a[Math.floor(r() * a.length)]; }

  var root = document.documentElement, land = document.getElementById('land');
  var fontLink = document.getElementById('tok-font');

  // Picked from the shuffle. A look is a seed plus what to change about it.
  var LOOKS = {
    A: {seed:950, name:'Look A · Fraunces + DM Serif · Forest',
        good:'outline', gfont:'"DM Serif Display"', gweight:400,
        gq:'family=DM+Serif+Display:ital@0;1'},
    B: {seed:7667, name:'Look B · DM Serif · Cream'}
  };

  function apply(seed, look){
    var r = rng(seed);
    var pal = pick(r, PALETTES), f = pick(r, FONTS);
    var upper = f.name === 'Anton' || f.name === 'Archivo Black' ? r() < .75 : r() < .35;
    var track = upper ? pick(r, [0, .01, .03]) : pick(r, [-.04, -.03, -.015, 0]);
    var layout = pick(r, LAYOUTS), good = pick(r, GOODS);
    var scale = f.name === 'Anton' ? 1.08 : (upper ? .9 : 1);
    var set = {
      '--l-bg':pal.bg, '--l-ink':pal.ink, '--l-dim':pal.dim, '--l-accent':pal.accent,
      '--l-accent2':pal.accent2, '--l-glow':pal.glow,
      '--f-display':f.d, '--f-text':f.t, '--d-weight':f.w,
      '--d-case':upper ? 'uppercase' : 'none', '--d-track':track + 'em', '--d-scale':scale,
      '--r':pick(r, ['0px', '10px', '999px'])
    };
    if (look && look.good) good = look.good;
    set['--g-font'] = look && look.gfont ? look.gfont : f.d;
    set['--g-weight'] = look && look.gweight ? look.gweight : f.w;
    for (var k in set) root.style.setProperty(k, set[k]);
    fontLink.href = 'https://fonts.googleapis.com/css2?' + f.q +
      (look && look.gq ? '&' + look.gq : '') + '&display=swap';
    land.className = 'land l-' + layout + ' g-' + good;
    document.getElementById('tokname').textContent = look ? look.name :
      'Style ' + String(seed).padStart(4, '0') + ' · ' + f.name + ' · ' + pal.name;
    document.querySelectorAll('.look').forEach(function(b){
      b.setAttribute('aria-pressed', String(!!look && LOOKS[b.dataset.look] === look));
    });
    document.querySelector('meta[name="theme-color"]') ||
      document.head.insertAdjacentHTML('beforeend', '<meta name="theme-color">');
    document.querySelector('meta[name="theme-color"]').content = pal.bg;
  }

  function fromHash(){
    var m = /style=(\d{1,4})/.exec(location.hash);
    return m ? +m[1] : 0;
  }
  function useLook(id){
    var L = LOOKS[id]; seed = L.seed; apply(L.seed, L);
    history.replaceState(null, '', '#look=' + id);
  }
  var hashLook = /look=([AB])/.exec(location.hash);
  var seed = fromHash() || 1;
  if (hashLook) useLook(hashLook[1]);
  else if (fromHash()) apply(seed);
  else useLook('A');                                // the shortlist leads until one wins
  document.querySelectorAll('.look').forEach(function(b){
    b.addEventListener('click', function(){ useLook(b.dataset.look); });
  });
  document.getElementById('shuffle').addEventListener('click', function(){
    var next; do { next = 1 + Math.floor(Math.random() * 9999); } while (next === seed);
    seed = next; apply(seed);
    history.replaceState(null, '', '#style=' + seed);
  });
  window.TOKENS = {apply:apply, seed:function(){ return seed; }};
})();
</script>

<script>
(function(){
  'use strict';

  /* ------------------------------------------------------------ the rooms */
  var ROOMS = [
    {name:'Sunrise Stack', n:12, minis:[
      ['Morning greens','What the day starts on.',['GI Primer','Daily fibre']],
      ['Multivitamin','The base layer.',['Double X','Vitamin D']],
      ['First water','Before the coffee.',['Electrolytes']]]},
    {name:'Protein Snack Pack', n:15, minis:[
      ['Shakes','Whey and plant.',['Vanilla','Chocolate']],
      ['Bars','Pocket protein.',['PB bar','Crisp bar']],
      ['Add-ins','Into anything.',['Collagen','Creamer']]]},
    {name:'Energy Elevation', n:14, minis:[
      ['XS cans','The hero.',['Peach Mango Elite','Electric Lemon']],
      ['Pre-workout','Before the session.',['Sports pre','Twist tubes']],
      ['Focus','Without the crash.',['Elite + Focus']]]},
    {name:'Recovery Room', n:13, minis:[
      ['Post-workout','After the session.',['Recovery blend']],
      ['Calm','Down-regulate.',['CBD','Ashwagandha']],
      ['Sleep stack','The overnight shift.',['Sleep Health','Sweet Dreams']]]},
    {name:'Skin Redefined', n:11, minis:[
      ['Cleanse','Start clean.',['Cleanser','Toner']],
      ['Treat','The actives.',['Serum','Sleeping mask']],
      ['Nutrition','From the inside.',['Skin nutrition','Glow up']]]}
  ];

  /* ----------------------------------------------------------- the film */
  // Two sizes of the same 75 frames: phones take the light set, big screens
  // the tall one. Swapping footage is a change to these three lines.
  var BIG = innerWidth > 900 || (devicePixelRatio > 2 && innerWidth > 480);
  var DIR = '../assets/generated/bakeoff/' + (BIG ? 'frames-counter-pour' : 'frames-pour-sm');
  var FRAMES = 75, PPF = 24, CACHE = 14;

  var run = document.getElementById('run'), stage = document.getElementById('stage');
  var cv = document.getElementById('film'), ctx = cv.getContext('2d', {alpha:false});
  var beat = document.getElementById('beat'), cap = document.getElementById('cap');
  var roomsEl = document.getElementById('rooms');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // a reload starts at the landing, not halfway down the pour
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  var blobs = new Array(FRAMES), bmps = new Array(FRAMES), used = [];
  var loaded = 0, last = -1, p = 0, dir = 1, ticking = false, w = 0, h = 0;

  function url(i){ return DIR + '/' + String(i + 1).padStart(4, '0') + '.webp'; }

  // first frame first, so there is something on screen immediately
  function load(){
    fetch(url(0)).then(function(r){ return r.blob(); }).then(function(b){
      blobs[0] = b; loaded = 1; draw(0);
      var i = 1;
      (function next(){
        if (i >= FRAMES) return;
        var k = i++;
        fetch(url(k)).then(function(r){ return r.blob(); }).then(function(b){
          blobs[k] = b; loaded++; next();
        }).catch(next);
      })();
    }).catch(function(){});
  }

  // decode on demand, keep a small window of bitmaps: 75 decoded frames would
  // be hundreds of MB on a phone
  function decode(i){
    if (bmps[i] || !blobs[i]) return;
    bmps[i] = 'pending';
    createImageBitmap(blobs[i]).then(function(bm){
      bmps[i] = bm; used.push(i);
      while (used.length > CACHE){
        var old = used.shift();
        if (old !== i && bmps[old] && bmps[old].close){ bmps[old].close(); bmps[old] = null; }
      }
      if (i === last) paint(bm);
    }).catch(function(){ bmps[i] = null; });
  }

  function paint(bm){
    var s = Math.max(w / bm.width, h / bm.height);
    var dw = bm.width * s, dh = bm.height * s;
    ctx.drawImage(bm, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  function draw(i){
    last = i;
    decode(i); decode(i + dir); decode(i + 2 * dir);
    for (var d = 0; d < FRAMES; d++){                 // nearest frame we can show
      var a = i - d, b = i + d;
      if (bmps[a] && bmps[a] !== 'pending'){ paint(bmps[a]); return; }
      if (bmps[b] && bmps[b] !== 'pending'){ paint(bmps[b]); return; }
    }
  }

  function size(){
    var r = Math.min(devicePixelRatio || 1, 2);
    w = stage.offsetWidth; h = stage.offsetHeight;
    cv.width = Math.round(w * r); cv.height = Math.round(h * r);
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    run.style.height = (reduced ? h : h + FRAMES * PPF) + 'px';
    if (last >= 0) draw(last); else draw(0);
  }

  function render(){
    ticking = false;
    var travel = run.offsetHeight - h;                // the film starts below the landing
    var q = travel > 0 ? Math.min(1, Math.max(0, (scrollY - run.offsetTop) / travel)) : 1;
    dir = q >= p ? 1 : -1; p = q;
    var i = Math.round(p * (FRAMES - 1));
    if (i !== last) draw(i);

    beat.style.opacity = String(Math.max(0, 1 - p * 5));   // the line clears early
    cap.style.opacity = String(Math.max(0, 1 - p * 8));
    var open = p > 0.88;
    roomsEl.classList.toggle('on', open);
  }
  function tick(){ if (!ticking){ ticking = true; requestAnimationFrame(render); } }

  addEventListener('scroll', tick, {passive:true});
  addEventListener('resize', function(){
    // height-only changes (mobile Safari's toolbar) must not re-size the stage
    if (stage.offsetWidth === w && stage.offsetHeight === h) return;
    size(); render();
  });

  /* ------------------------------------------------------ rooms and sheet */
  var list = document.getElementById('room-list');
  var sheet = document.getElementById('sheet'), rail = document.getElementById('rail');
  ROOMS.forEach(function(r){
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.className = 'room'; b.type = 'button';
    b.innerHTML = '<i></i><b>' + r.name + '</b><span>' + r.n + '</span>';
    b.addEventListener('click', function(){ open(r); });
    li.appendChild(b); list.appendChild(li);
  });
  function open(r){
    document.getElementById('sheet-title').textContent = r.name;
    rail.innerHTML = r.minis.map(function(m){
      return '<article class="mini"><b>' + m[0] + '</b><p>' + m[1] + '</p><ul>' +
        m[2].map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul></article>';
    }).join('');
    sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false');
    document.getElementById('back').focus();
  }
  function close(){
    sheet.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('back').addEventListener('click', close);
  addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });

  size(); load(); render();
  if (reduced){ roomsEl.classList.add('on'); beat.style.opacity = 1; }

  window.POUR = {frames:FRAMES, ppf:PPF, dir:DIR, travel:function(){ return FRAMES * PPF; }};
})();
</script>
</body>
</html>
